name: anibee
description: "aniBee — personal iOS anime app. Miruro-linked, AniList-powered."
publish_to: 'none'
version: 0.2.20+24

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # libmpv player (same engine as Zeus): media_kit + video UI + iOS libs.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # iOS Picture-in-Picture for the mpv player (Zeus-proven mechanism:
  # forked media_kit_video frame tap + native sample-buffer plugin).
  anibee_mpv_pip:
    path: packages/anibee_mpv_pip

  # Reicon icons (reicon.dev, MIT) for the Settings screen.
  flutter_svg: ^2.2.3
  reicon_flutter: ^1.0.1

  # 0.2.13: REAL Liquid Glass nav — the same forked package Zeus
  # uses (liquid_glass_bottom_nav 0.0.14, vendored from
  # ~/workspace/zeus-v101/packages/liquid_glass_bottom_nav — see
  # packages/liquid_glass_bottom_nav/FORK.md: only the OpenGL ES
  # Y-flip guard for engine >= 3.44 differs from pub.dev). 0.2.12
  # only copied the package's blur/surface VALUES into a hand-rolled
  # pill, so the phone saw plain transparency, not liquid glass —
  # the look comes from the package's shader refraction, not values.
  liquid_glass_bottom_nav:
    path: packages/liquid_glass_bottom_nav

  shared_preferences: ^2.5.4
  local_auth: ^3.0.2
  crypto: ^3.0.7

  # 0.2.5: real offline downloads — app documents dir for HLS
  # segments / playlist and direct files.
  path_provider: ^2.1.5

  # M2 real services: HTTP clients, secure token/key storage, OAuth
  # webview, AES-CBC (megaplay) + HTML parsing (Anikoto).
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  webview_flutter: ^4.14.1
  pointycastle: ^4.0.0
  html: ^0.15.6

  # 0.2.4: "Load subtitle file" in the Zeus-style subtitle panel
  # (pick .srt/.ass from Files, load as an external mpv track).
  file_picker: ^13.4.1
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2

  # 0.2.11: Wi-Fi-only downloads need a real connectivity check
  # (connectivity_plus); backup export shares the file via the iOS
  # share sheet (share_plus).
  connectivity_plus: ^6.1.4
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

  # 0.2.13: airing date formatting ("Nov 29 at 22:05").
  intl: ^0.20.2

  # 0.2.19: Chromecast in the player (default receiver CC1AD845,
  # no custom receiver). flutter_chrome_cast EXACTLY 1.2.9 — the
  # LAST CocoaPods-only version, deliberately NOT 1.5.0/2.0.0:
  # - v2.0.0 (CI 45381897023) and v1.5.0 (CI 45385952045) BOTH fail
  #   the iOS build: their GoogleCast SPM package resolves to
  #   SRGSSR 4.8.6, which needs iOS 16.0 (.iOS(.v16)), but this app
  #   targets iOS 15.6 ("package product 'GoogleCast' requires
  #   minimum platform version 16.0 ... target supports 15.0").
  # - 1.2.9 has no Package.swift, so Flutter integrates it via
  #   CocoaPods like the media_kit plugins: podspec iOS 14.0,
  #   google-cast-sdk ~> 4.8 (the CocoaPods SDK needs only iOS 14).
  # - Exact pin, NO caret: ^1.2.9 would resolve to 1.5.0 again.
  # - Its Dart API is identical to v2 for everything
  #   cast_service.dart uses (verified: analyze clean, all 23 Cast
  #   tests pass). Do NOT bump without also raising the iOS
  #   deployment target to 16.0 (drops iOS 15 users — needs the
  #   user's say-so). The player talks to it only through
  #   lib/services/cast_service.dart (mockable).
  flutter_chrome_cast: 1.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# media_kit_video is vendored (packages/media_kit_video) — the ZoroX fork
# with the iOS frame-export tap that feeds the PiP plugin. Byte-identical
# to pub.dev 2.0.1 except that tap (see packages/media_kit_video/FORK.md).
dependency_overrides:
  media_kit_video:
    path: packages/media_kit_video

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg
    - assets/splash_mark.png
    - assets/launch_image.png
    - assets/providers.json
