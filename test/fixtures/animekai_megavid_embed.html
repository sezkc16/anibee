    link.rel = "noopener";
    link.title = isAnimex ? "" : "MegaVid";
    link.innerHTML = '<img src="' + (isAnimex ? ANIMEX_LOGO : MEGA_LOGO) + '" alt="' + (isAnimex ? "AnimeX" : "MEGA") + '">';
    // Sit at the start of the right-aligned control group (after the last flex spacer).
    var spacers = container.querySelectorAll(".jw-spacer");
    var anchor = spacers.length ? spacers[spacers.length - 1] : null;
    if (anchor) {
      container.insertBefore(link, anchor.nextSibling);
    } else {
      var fs = container.querySelector(".jw-icon-fullscreen");
      if (fs) { container.insertBefore(link, fs); } else { container.appendChild(link); }
    }
  }
  var playbackRates = Array.isArray(d.playbackRates) && d.playbackRates.length
    ? d.playbackRates
    : [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];

  var setup = {
    file: data.source,
    width: "100%",
    height: "100%",
    stretching: "bestfit",
    skin: { name: "netflix", active: color },
    playbackRateControls: true,
    mute: false,
    autostart: false,
    playbackRates: playbackRates,
    tracks: axWithChapters(data.tracks)
  };

  // Some sources (aniwave/echovideo) serve HLS from an extension-less URL; JWPlayer
  // needs an explicit type to choose its HLS provider instead of guessing progressive.
  if (data.type) setup.type = data.type;

  if (wantAutoplay) {
    setup.autostart = "viewable";
    setup.mute = true;
  }

  jwplayer("player").setup(setup);
  jwplayer("player").on("firstFrame", function () { hideError(); if (isAnimex) placeChapterBands(); });

  // Auto-fallback: an OUR-copy (R2) playback/setup failure silently switches to the provider.
  jwplayer("player").on("error", function (e) {
    if (isAnimex) { if (axFailover()) return; if (!triedFallback) { fallbackWith("noax=1"); return; } }
    else if (isMega && !triedFallback) { fallbackWith("provider=1"); return; }
    showError("This video file cannot be played.", (e && e.code) || 232011);
  });
  jwplayer("player").on("setupError", function (e) {
    if (isAnimex) { if (axFailover()) return; if (!triedFallback) { fallbackWith("noax=1"); return; } }
    else if (isMega && !triedFallback) { fallbackWith("provider=1"); return; }
    showError("This video file cannot be played.", (e && e.code) || 232011);
  });

  // Default to 480p when the stream exposes multiple qualities (mobile-friendly);
  // the viewer can still switch. Applies once, when levels first load.
  // Subtitles default-on for OUR cached copies (soft-sub tracks). JW leaves captions
  // off unless told; enable the English (or first) track once the list is known.
  jwplayer("player").on("captionsList", function (e) {
    if (!isMega && !isAnimex) return;
    try {
      var list = (e && e.tracks) || jwplayer("player").getCaptionsList() || [];
      if (jwplayer("player").getCurrentCaptions() > 0) return;
      var pick = 0;
      for (var i = 1; i < list.length; i++) {
        var lbl = ((list[i].label || "") + " " + (list[i].id || "")).toLowerCase();
        if (/eng|english|en/.test(lbl)) { pick = i; break; }
        if (pick === 0) pick = i;
      }
      if (pick > 0) jwplayer("player").setCurrentCaptions(pick);
    } catch (err) {}
  });

  var qualityPinned = false;
  jwplayer("player").on("levels", function (e) {
    // AnimeX: never force a quality — let hls.js ABR auto-pick (starts low, adapts up, no 1080 stall).
    if (qualityPinned || isAnimex) return;
    try {
      var levels = (e && e.levels) || jwplayer("player").getQualityLevels() || [];
      for (var i = 0; i < levels.length; i++) {
        var L = levels[i] || {};
        if ((L.height && Number(L.height) === 480) || /(^|\D)480(\D|p|$)/i.test(L.label || "")) {
          jwplayer("player").setCurrentQuality(i);
          qualityPinned = true;
          break;
        }
      }
    } catch (err) {}
  });

  var unmuted = false;
  function tryUnmute() {
    if (unmuted) return;
    try {
      var p = jwplayer("player");
      if (!p || typeof p.setMute !== "function") return;
      p.setMute(false);
      if (typeof p.setVolume === "function") p.setVolume(100);
      if (!p.getMute()) {
        unmuted = true;
        if (p.getState() !== "playing") { try { p.play(true); } catch (e) {} }
      }
    } catch (e) {}
  }

  jwplayer("player").on("ready", function () {
    loading.style.display = "none";
    moveSkipButtons();
    placeMegaLogo();
    setupAnimexUI();
    if (wantAutoplay) {
      try { jwplayer("player").play(true); } catch (e) {}
      tryUnmute();
      setTimeout(tryUnmute, 100);
      setTimeout(tryUnmute, 400);
      setTimeout(tryUnmute, 1000);
    }
  });

  if (wantAutoplay) {
    jwplayer("player").on("play", function () { tryUnmute(); });
    jwplayer("player").on("firstFrame", function () { tryUnmute(); });

    ["pointerdown", "keydown", "touchstart", "click", "mousemove", "scroll"].forEach(function (ev) {
      document.addEventListener(ev, tryUnmute, { capture: true, passive: true, once: false });
    });
  }

  window.addEventListener("message", function (ev) {
    if (!wantAutoplay) return;
    var data = ev.data;
    if (typeof data === "string") {
      if (data === "unmute" || data === "play") { tryUnmute(); return; }
      try { data = JSON.parse(data); } catch (e) { return; }
    }
    if (data && (data.type === "unmute" || data.type === "play" || data.event === "play")) {
      tryUnmute();
      if (data.type === "play" || data.event === "play") {
        try { jwplayer("player").play(true); } catch (e) {}
      }
    }
  });

  function buildForwardButton(rewindBtn) {
    var btn = rewindBtn.cloneNode(true);
    btn.className = btn.className.replace(/jw-icon-rewind/g, "jw-icon-forward") + " jw-custom-forward";
    btn.setAttribute("aria-label", "Forward 10 Seconds");

    var svg = btn.querySelector("svg");
    if (svg) {
      svg.setAttribute("class", (svg.getAttribute("class") || "").replace(/jw-svg-icon-rewind/g, "jw-svg-icon-forward"));
      svg.style.transform = "scaleX(-1)";
    }

    function doSeek() {
      try {
        var p = jwplayer("player");
        var pos = p.getPosition();
        var dur = p.getDuration();
        var target = pos + 10;
        if (dur > 0 && target > dur - 0.5) target = Math.max(0, dur - 0.5);
        p.seek(target);
      } catch (e) {}
    }

    btn.addEventListener("click", function (e) { e.stopPropagation(); doSeek(); });
    btn.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); doSeek(); }
    });
    return btn;
  }

  function moveSkipButtons() {
    var controlbar = document.querySelector(".jw-controlbar");
    if (!controlbar) return;

    var rewind = controlbar.querySelector(".jw-icon-rewind");
    if (!rewind) return;

    var forward = controlbar.querySelector(".jw-custom-forward");
    var captions = controlbar.querySelector(".jw-icon-cc, .jw-icon-subtitles, .jw-icon-captions");
    var rightGroup = controlbar.querySelector(".jw-right-group");

    if (!forward) {
      forward = buildForwardButton(rewind);
    }

    if (!captions) {
      var host = rightGroup || rewind.parentNode || controlbar;
      if (rewind.parentNode !== host) host.appendChild(rewind);
      if (forward.parentNode !== host || forward.previousSibling !== rewind) {
        host.insertBefore(forward, rewind.nextSibling);
      }
      return;
    }

    if (rightGroup) rightGroup.insertBefore(rewind, captions);
    else captions.parentNode.insertBefore(rewind, captions);

    if (rightGroup) rightGroup.insertBefore(forward, captions);
    else captions.parentNode.insertBefore(forward, captions);
  }

  // Re-run on control bar rebuilds (fullscreen toggle, etc.) so the forward
  // button doesn't get wiped out.
  function refreshBar() { moveSkipButtons(); placeMegaLogo(); }
  jwplayer("player").on("fullscreen", function () { setTimeout(refreshBar, 50); });
  jwplayer("player").on("controls", function () { setTimeout(refreshBar, 50); });
  jwplayer("player").on("playlistItem", function () { setTimeout(refreshBar, 50); });

  function send(data) {
    try {
      var msg = JSON.stringify(data);
      window.parent.postMessage(msg, "*");
    } catch (e) {}
  }

  var lastLogTime = -1;

  jwplayer("player").on("time", function (e) {
    send({
      channel: "kisskh",
      event: "time",
      time: e.position,
      duration: e.duration,
      percent: e.duration > 0 ? e.position / e.duration : 0
    });

    if (Math.floor(e.position) !== lastLogTime) {
      lastLogTime = Math.floor(e.position);
      send({
        type: "watching-log",
        currentTime: e.position,
        duration: e.duration
      });
    }
  });

  jwplayer("player").on("complete", function () {
    send({ channel: "kisskh", event: "complete" });
  });

  // In-page guard so multiple JWPlayer error events in a single page load can never
  // trigger more than one reload (the refresh=1 URL flag guards across the reload).
  var refreshAttempted = false;

  jwplayer("player").on("error", function (e) {
    // AnimeX sources self-heal in place via the earlier error handler (axFailover switches to the
    // next server). Never full-page-reload them here — that would abort the failover mid-fetch.
    if (isAnimex) return;
    send({
      channel: "kisskh",
      event: "error",
      message: (e && e.message) || "playback error"
    });

    // Signed CDN links expire mid-session. Try ONE automatic reload that asks the
    // server to bypass its cache and fetch a fresh link (?refresh=1) before giving
    // up - this self-heals stale streams whether they were served by the worker or
    // this server. Two guards prevent any loop: the in-page flag (multiple error
    // events) and the refresh=1 URL flag (across the reload, and on a dead stream).
    try {
      var u = new URL(window.location.href);
      if (!refreshAttempted && u.searchParams.get("refresh") !== "1") {
        refreshAttempted = true;
        u.searchParams.set("refresh", "1");
        u.searchParams.set("_r", Date.now().toString());
        window.location.replace(u.toString());
        return;
      }
    } catch (reloadErr) {}

    showError((e && e.message) || "Playback failed. Please try another server.",
      (e && (e.code || (e.sourceError && e.sourceError.code))) || "PLAYBACK");
  });
  } // end initPlayer
})();
</script>
</body>
</html>
